<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F4EBDD" />
    <meta name="robots" content="noindex,nofollow" />
    <title>测试合集 · TEST SUITE</title>
    <style>
      :root {
        --paper: #f4ebdd;
        --paper-light: #fbf7ee;
        --ink: #2d2723;
        --ink-60: rgba(45, 39, 35, 0.6);
        --red: #e5543d;
        --yellow: #f2c14e;
        --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif;
        --serif: "Songti SC", "STSong", "Noto Serif SC", "SimSun", serif;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 8%, rgba(229, 84, 61, 0.08), transparent 30%),
          radial-gradient(circle at 88% 86%, rgba(47, 93, 80, 0.08), transparent 32%),
          var(--paper);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(45, 39, 35, 0.14) 0.6px, transparent 0.6px);
        background-size: 7px 7px;
        opacity: 0.2;
      }
      .wrap {
        position: relative;
        z-index: 1;
        width: calc(100% - 36px);
        max-width: 720px;
        margin: 0 auto;
        padding: calc(28px + env(safe-area-inset-top)) 0 calc(30px + env(safe-area-inset-bottom));
      }
      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 20px;
      }
      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        line-height: 1.05;
      }
      .brand b {
        font-size: 13px;
        letter-spacing: 0.14em;
      }
      .brand span {
        font-family: var(--serif);
        font-size: 10px;
        letter-spacing: 0.3em;
        color: var(--ink-60);
      }
      .issue {
        padding: 5px 9px;
        border: 1.5px solid var(--ink);
        border-radius: 999px;
        background: var(--paper-light);
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
      }
      .heading {
        margin-top: clamp(54px, 10vh, 100px);
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.22em;
        color: var(--ink-60);
      }
      .kicker::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
      }
      h1 {
        margin: 14px 0 0;
        font-size: clamp(52px, 13vw, 92px);
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -0.07em;
      }
      h1 em {
        display: inline-block;
        font-style: normal;
        color: var(--red);
        background: linear-gradient(transparent 76%, var(--yellow) 76%, var(--yellow) 92%, transparent 92%);
      }
      .lead {
        max-width: 360px;
        margin: 22px 0 0;
        font-family: var(--serif);
        font-size: 15px;
        line-height: 1.8;
        letter-spacing: 0.03em;
        color: var(--ink-60);
      }
      .list-label {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: clamp(40px, 8vh, 72px) 0 14px;
        font-family: var(--mono);
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.16em;
        color: var(--ink-60);
      }
      .list-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(45, 39, 35, 0.18);
      }
      .test-card {
        display: grid;
        grid-template-columns: 110px 1fr 34px;
        gap: 16px;
        align-items: center;
        padding: 10px 16px 10px 10px;
        border: 1.5px solid var(--ink);
        border-radius: 20px;
        background: var(--paper-light);
        color: inherit;
        text-decoration: none;
        box-shadow: 5px 5px 0 rgba(45, 39, 35, 0.13);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .test-card:hover {
        transform: translate(-2px, -2px);
        box-shadow: 8px 8px 0 var(--red);
      }
      .thumb {
        width: 110px;
        height: 128px;
        overflow: hidden;
        border: 1.5px solid var(--ink);
        border-radius: 13px;
        background: var(--yellow);
      }
      .thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 32%;
      }
      .test-info {
        min-width: 0;
      }
      .test-info small {
        display: block;
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.08em;
        color: var(--ink-60);
      }
      .test-info h2 {
        margin: 6px 0 2px;
        font-family: var(--serif);
        font-size: clamp(25px, 5vw, 34px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      .test-info p {
        margin: 0;
        font-size: 12px;
        color: var(--ink-60);
      }
      .arrow {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1.5px solid var(--ink);
        border-radius: 50%;
        font-size: 15px;
      }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-top: 54px;
        padding-top: 12px;
        border-top: 1px solid rgba(45, 39, 35, 0.14);
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.04em;
        color: var(--ink-60);
      }
      @media (max-width: 420px) {
        .test-card {
          grid-template-columns: 84px 1fr 30px;
          gap: 12px;
          padding-right: 12px;
        }
        .thumb {
          width: 84px;
          height: 106px;
        }
        h1 {
          font-size: clamp(46px, 14.5vw, 68px);
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <div class="brand"><b>TEST SUITE</b><span>测试合集</span></div>
        <span class="issue">VOL. 01</span>
      </header>

      <section class="heading">
        <p class="kicker">一些奇奇怪怪的小测试</p>
        <h1>测试<br /><em>合集</em>。</h1>
        <p class="lead">不负责准确，只负责让你多认识自己一点点。<br />新的测试会陆续收进来。</p>
      </section>

      <p class="list-label">OPEN FILE / 可进入</p>
      <a class="test-card" href="cat-archive/">
        <span class="thumb"><img src="cat-archive/preview/cover.jpg" alt="猫格档案馆封面" /></span>
        <span class="test-info">
          <small>NO. 01 / 性格测试</small>
          <h2>猫格档案馆</h2>
          <p>12 道题，测测你是哪种猫</p>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <footer>
        <span>TEST SUITE © 2026</span>
        <span>持续收集中</span>
      </footer>
    </main>
  </body>
</html>
